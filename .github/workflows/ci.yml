name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx run-many --target=lint --parallel=3

      - name: Build
        run: npx nx run-many --target=build --projects=@nebula-rn/sdk,@nebula-rn/host-apis,@nebula-rn/components,@nebula-rn/client,@nebula-rn/cli --parallel=3

      - name: Verify publishable packages
        run: |
          npm pack --dry-run --workspace=@nebula-rn/sdk
          npm pack --dry-run --workspace=@nebula-rn/host
          npm pack --dry-run --workspace=@nebula-rn/host-apis
          npm pack --dry-run --workspace=@nebula-rn/components
          npm pack --dry-run --workspace=@nebula-rn/client
          npm pack --dry-run --workspace=@nebula-rn/cli
